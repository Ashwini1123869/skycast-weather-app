<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast | Premium Weather Forecast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" crossorigin href="/assets/index-D4rVows1.css">
</head>

<body class="theme-default">
    <canvas id="weatherCanvas"></canvas>
    <div class="bg-pattern"></div>

    <div id="loader" class="loader-container">
        <div class="loader"></div>
    </div>

    <main class="app-container">
        <header class="search-section">
            <div class="search-box">
                <input type="text" id="locationInput" placeholder="Enter city name..." autocomplete="off">
                <button id="searchBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
            <div id="suggestions" class="suggestions-box"></div>
        </header>

        <section id="weatherOutput" class="weather-content hidden">
            <div class="hero-card">
                <div class="location-info">
                    <h1 id="cityName">New York</h1>
                    <p id="currentDate">Saturday, 7 March</p>
                </div>
                <div class="main-stats">
                    <div class="temp-box">
                        <span id="currentTemp">24</span><span class="unit">°C</span>
                    </div>
                    <div class="weather-meta">
                        <img id="weatherIcon" src="" alt="Weather Icon">
                        <span id="weatherDesc">Partly Cloudy</span>
                    </div>
                </div>

                <div id="desiMood" class="desi-mood-box hidden">
                    <span class="mood-title">Mood Advisory:</span>
                    <p id="moodText"></p>
                </div>

                <div class="extra-stats">
                    <div class="stat-item">
                        <span class="label">Humidity</span>
                        <span id="humidity" class="value">45%</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">Wind Speed</span>
                        <span id="windSpeed" class="value">12 km/h</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">UV Index</span>
                        <span id="uvIndex" class="value">Moderate</span>
                    </div>
                </div>
            </div>

            <div class="forecast-section">
                <h2>Next 24 Hours</h2>
                <div id="hourlyForecast" class="hourly-grid">
                    <!-- Hourly items will be injected here -->
                </div>
            </div>

            <div class="forecast-section">
                <h2>Next 7 Days</h2>
                <div id="dailyForecast" class="daily-list">
                    <!-- Daily items will be injected here -->
                </div>
            </div>
        </section>

        <div id="errorMsg" class="error-container hidden">
            <p>Oops! Location not found. Please try another city.</p>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
